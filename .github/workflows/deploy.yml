name: Build, Test, Push Docker Images & Deploy to Render

on:
  push:
    branches:
      - main

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-frontend

jobs:
  # Step 1: Run backend tests
  test-backend:
    runs-on: ubuntu-latest
    name: Test Backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install backend dependencies
        run: |
          cd backend
          pnpm install --frozen-lockfile

      - name: Run backend tests
        run: |
          cd backend
          pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: "postgresql://test:test@localhost:5432/expense_tracker_test"

  # Step 2: Run frontend tests
  test-frontend:
    runs-on: ubuntu-latest
    name: Test Frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: |
          cd frontend
          pnpm test
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: "https://expense-tracker-backend-nii9.onrender.com/api"

  # Step 3: Build and push Docker images (only if tests pass)
  build-and-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    name: Build and Push Docker Images
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://expense-tracker-backend-nii9.onrender.com/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Step 4: Trigger Render deployment webhooks
  trigger-render-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    name: Trigger Render Deployment
    steps:
      - name: Trigger backend deployment on Render
        run: |
          curl --request POST \
            --url ${{ secrets.RENDER_BACKEND_WEBHOOK_URL }} \
            --header 'Content-Type: application/json'

      - name: Trigger frontend deployment on Render
        run: |
          curl --request POST \
            --url ${{ secrets.RENDER_FRONTEND_WEBHOOK_URL }} \
            --header 'Content-Type: application/json'

      - name: Wait for deployment to complete (optional)
        run: sleep 30
