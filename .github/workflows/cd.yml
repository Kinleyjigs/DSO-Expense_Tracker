name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/expense-tracker-frontend
  NEXT_PUBLIC_API_URL: https://expense-tracker-backend-nii9.onrender.com/api

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install backend dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/expense_tracker_ci
        run: pnpm db:generate

      - name: Run backend tests
        working-directory: ./backend
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test:test@localhost:5432/expense_tracker_test
        run: pnpm test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        working-directory: ./frontend
        env:
          NODE_ENV: test
          NEXT_PUBLIC_API_URL: https://expense-tracker-backend-nii9.onrender.com/api
        run: pnpm test

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          no-cache: true
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          no-cache: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy-render:
    name: Trigger Render Deploys
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Validate deploy hook secrets
        shell: bash
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_WEBHOOK_URL }}
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_WEBHOOK_URL }}
        run: |
          if [[ -z "$BACKEND_HOOK" || -z "$FRONTEND_HOOK" ]]; then
            echo "Missing one or both Render webhook secrets. Add RENDER_BACKEND_WEBHOOK_URL and RENDER_FRONTEND_WEBHOOK_URL in GitHub Secrets."
            exit 1
          fi

      - name: Trigger backend deploy hook
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_BACKEND_WEBHOOK_URL }}
        run: curl -fsSL -X POST "$BACKEND_HOOK"

      - name: Trigger frontend deploy hook
        env:
          FRONTEND_HOOK: ${{ secrets.RENDER_FRONTEND_WEBHOOK_URL }}
        run: curl -fsSL -X POST "$FRONTEND_HOOK"